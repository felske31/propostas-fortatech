name: Firebase security checks
on:
  push:
    branches: [fix/firestore-access-before-expiry]
  pull_request:
    paths:
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.html'
      - firestore.rules
      - firebase.json
      - package.json
      - .github/workflows/firebase-security.yml
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax and entry point consistency
        run: |
          node --check v2-auth-db.js
          node --check app.js
          node --check app-v2.js
          node --check scripts/migrate-firestore.mjs
          cmp app.js app-v2.js
      - run: npm run test:sessions
      - run: npm run test:rules
